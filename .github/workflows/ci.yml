name: Bootstrap CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: bootstrap_ci
          POSTGRES_PASSWORD: ci-disposable-example
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bootstrap_ci -d postgres"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://bootstrap_ci:ci-disposable-example@127.0.0.1:5432/unused
      TEST_DATABASE_ADMIN_URL: postgresql://bootstrap_ci:ci-disposable-example@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:validate
      - run: npm run db:smoke
      - run: npm run test:http -- --dev
      - run: npm run build
      - run: npm run test:http
